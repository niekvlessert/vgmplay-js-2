<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>VGMPlay-js Mini Game</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }

        canvas {
            border: 2px solid #444;
            background: #000;
            box-shadow: 0 0 20px #0f0;
        }

        #instructions {
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div id="loading">Loading VGMPlay... click Canvas to Start!</div>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <div id="instructions">Arrows: Move | Spacebar: Shoot | Music automatically plays</div>
    <script src="vgmplay-js-glue.js" data-library="true"></script>
    <script src="game.js"></script>
</body>

</html>
