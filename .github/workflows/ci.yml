name: CI/CD Build & Release

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "ci"
  cancel-in-progress: true

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compute WASM cache key
        id: wasm-cache-key
        run: |
          {
            git ls-files -s \
              CMakeLists.txt FindZLIB.cmake \
              src patches modules \
              | grep -v '^160000' || true
            git submodule status --recursive
          } | sha256sum | awk '{print "key=wasm-linux-" $1}' >> "$GITHUB_OUTPUT"

      - name: Restore WASM cache
        id: wasm-cache
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.wasm-cache-key.outputs.key }}
          path: |
            vgmplay-js.js
            vgmplay-js.wasm
            vgmplay-js.data

      - name: Setup Emscripten
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: mymindstorm/setup-emsdk@v14

      - name: Pre-build Cleanup
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: rm -f vgmplay-js.js vgmplay-js.wasm vgmplay-js.data

      - name: Fetch LibAtrac9
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: |
          if [ ! -d modules/vgmstream/dependencies/LibAtrac9 ]; then
            git clone --depth 1 https://github.com/Thealexbarney/LibAtrac9 modules/vgmstream/dependencies/LibAtrac9
          fi

      - name: Build WASM
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p build
          cd build
          emcmake cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_HAVE_LIBC_PTHREAD=1 -DATRAC9_PATH="${GITHUB_WORKSPACE}/modules/vgmstream/dependencies/LibAtrac9"
          emmake make -j4

      - name: Verify Build Output
        run: |
          ls -l vgmplay-js.js vgmplay-js.wasm || true
          if [ ! -f vgmplay-js.js ] || [ ! -f vgmplay-js.wasm ]; then
            echo "Error: Build did not produce required JS/WASM files"
            exit 1
          fi

      - name: Save WASM cache
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.wasm-cache-key.outputs.key }}
          path: |
            vgmplay-js.js
            vgmplay-js.wasm
            vgmplay-js.data
          
      - name: Prepare Extensions
        run: |
          chmod +x prepare_for_usage.sh
          ./prepare_for_usage.sh
          zip -r extension.zip extension
          zip -r ff_extension.zip ff_extension

      - name: Upload WASM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-artifacts
          if-no-files-found: error
          path: |
            vgmplay-js.js
            vgmplay-js.wasm
            vgmplay-js.data

      - name: Upload Extension Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: browser-extensions
          if-no-files-found: error
          path: |
            extension.zip
            ff_extension.zip

  deploy-pages:
    needs: [build-wasm]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Download WASM Artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-artifacts
          path: .

      - name: Prepare Pages artifact
        run: |
          rm -rf pages
          mkdir -p pages
          ./scripts/sync_web_assets.sh copy pages
          ./scripts/sync_web_assets.sh --manifest web-desktop-assets.txt copy pages
          if [ ! -d pages/dist ]; then
            echo "Error: pages/dist is missing"
            exit 1
          fi
          python3 -c "import json; from pathlib import Path; dist = Path('pages/dist'); files = [p.relative_to(dist).as_posix() for p in dist.rglob('*') if p.is_file() and p.name != 'manifest.json' and not p.name.startswith('.')]; files.sort(); (dist / 'manifest.json').write_text(json.dumps(files, indent=2)); print(f'Wrote pages/dist/manifest.json with {len(files)} files')"
          touch pages/.nojekyll

      - name: Verify Deployment Artifacts
        run: |
          if [ ! -f pages/vgmplay-js.js ] || [ ! -f pages/vgmplay-js.wasm ] || [ ! -f pages/dist/manifest.json ]; then
            echo "Error: Essential WASM files missing before deployment"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-mac:
    needs: build-wasm
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download WASM Artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-artifacts
          path: .
          
      - name: Build DMG
        run: |
          cd desktop-app-mac
          chmod +x build_dmg.sh
          ./build_dmg.sh

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VGMPlay-macOS.dmg
          path: desktop-app-mac/VGMPlay-macOS.dmg

  build-linux:
    needs: build-wasm
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev zip

      - name: Download WASM Artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-artifacts
          path: .

      - name: Build Linux app
        run: |
          cmake -S desktop-app-lin -B desktop-app-lin/build -DCMAKE_BUILD_TYPE=Release
          cmake --build desktop-app-lin/build --config Release --parallel 4

      - name: Package Linux app
        run: |
          mkdir -p desktop-app-lin/package
          cp -a desktop-app-lin/build/VGMPlay desktop-app-lin/package/
          ./scripts/sync_web_assets.sh copy desktop-app-lin/package
          ./scripts/sync_web_assets.sh --manifest web-desktop-assets.txt copy desktop-app-lin/package
          cd desktop-app-lin/package
          zip -r ../VGMPlay-linux.zip .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VGMPlay-linux.zip
          if-no-files-found: error
          path: desktop-app-lin/VGMPlay-linux.zip

  build-windows:
    needs: build-wasm
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download WASM Artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-artifacts
          path: .

      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -OutputDirectory desktop-app-win/packages -ExcludeVersion
          "WEBVIEW2_SDK_DIR=$PWD\desktop-app-win\packages\Microsoft.Web.WebView2" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Windows app
        shell: pwsh
        run: |
          cmake -S desktop-app-win -B desktop-app-win/build -A x64 -DCMAKE_BUILD_TYPE=Release
          cmake --build desktop-app-win/build --config Release --parallel 4

      - name: Package Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop-app-win/package | Out-Null
          Copy-Item desktop-app-win/build/Release/* desktop-app-win/package -Recurse
          Compress-Archive -Path desktop-app-win/package/* -DestinationPath desktop-app-win/VGMPlay-windows.zip -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VGMPlay-windows.zip
          if-no-files-found: error
          path: desktop-app-win/VGMPlay-windows.zip

  release:
    needs: [build-wasm, build-mac, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Extension Artifacts
        uses: actions/download-artifact@v4
        with:
          name: browser-extensions
          path: .

      - name: Download DMG Artifact
        uses: actions/download-artifact@v4
        with:
          name: VGMPlay-macOS.dmg
          path: .

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: VGMPlay-linux.zip
          path: .

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: VGMPlay-windows.zip
          path: .

      - name: Release Note Payload
        run: |
          echo "Automated CI build from commit ${{ github.sha }}" > release_notes.txt
          
      - name: Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "VGMPlay Latest Nightly"
          body_path: release_notes.txt
          files: |
            VGMPlay-macOS.dmg
            VGMPlay-linux.zip
            VGMPlay-windows.zip
            extension.zip
            ff_extension.zip
          draft: false
          prerelease: true
