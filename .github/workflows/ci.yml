name: CI/CD Build & Release

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "ci"
  cancel-in-progress: true

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Pre-build Cleanup
        run: rm -f vgmplay-js.js vgmplay-js.wasm vgmplay-js.data

      - name: Fetch LibAtrac9
        run: |
          if [ ! -d modules/vgmstream/dependencies/LibAtrac9 ]; then
            git clone --depth 1 https://github.com/Thealexbarney/LibAtrac9 modules/vgmstream/dependencies/LibAtrac9
          fi

      - name: Build WASM
        run: |
          mkdir -p build
          cd build
          emcmake cmake ..
          emmake make -j4

      - name: Verify Build Output
        run: |
          ls -l vgmplay-js.js vgmplay-js.wasm || true
          if [ ! -f vgmplay-js.js ] || [ ! -f vgmplay-js.wasm ]; then
            echo "Error: Build did not produce required JS/WASM files"
            exit 1
          fi
          
      - name: Prepare Extensions
        run: |
          chmod +x prepare_for_usage.sh
          ./prepare_for_usage.sh
          zip -r extension.zip extension
          zip -r ff_extension.zip ff_extension

      - name: Upload WASM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-artifacts
          if-no-files-found: error
          path: |
            vgmplay-js.js
            vgmplay-js.wasm
            vgmplay-js.data

      - name: Upload Extension Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: browser-extensions
          if-no-files-found: error
          path: |
            extension.zip
            ff_extension.zip

  deploy-pages:
    needs: [build-wasm, build-mac]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Download WASM Artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-artifacts
          path: .

      - name: Verify Deployment Artifacts
        run: |
          if [ ! -f vgmplay-js.js ] || [ ! -f vgmplay-js.wasm ]; then
            echo "Error: Essential WASM files missing before deployment"
            exit 1
          fi

      - name: Disable Jekyll
        run: touch .nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-mac:
    needs: build-wasm
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download WASM Artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-artifacts
          path: .
          
      - name: Build DMG
        run: |
          cd desktop-app-mac
          chmod +x build_dmg.sh
          ./build_dmg.sh

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VGMPlay-macOS.dmg
          path: desktop-app-mac/VGMPlay-macOS.dmg

  release:
    needs: [build-wasm, build-mac]
    runs-on: ubuntu-latest
    steps:
      - name: Download Extension Artifacts
        uses: actions/download-artifact@v4
        with:
          name: browser-extensions
          path: .

      - name: Download DMG Artifact
        uses: actions/download-artifact@v4
        with:
          name: VGMPlay-macOS.dmg
          path: .

      - name: Release Note Payload
        run: |
          echo "Automated CI build from commit ${{ github.sha }}" > release_notes.txt
          
      - name: Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "VGMPlay Latest Nightly"
          body_path: release_notes.txt
          files: |
            VGMPlay-macOS.dmg
            extension.zip
            ff_extension.zip
          draft: false
          prerelease: true
